name: Promote devmode to main

on:
  push:
    branches:
      - devmode
  workflow_dispatch:

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout devmode (full history)
        uses: actions/checkout@v4
        with:
          ref: devmode
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Merge devmode into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff origin/devmode -m "chore: auto-merge devmode into main [CI passed]"
          git push origin main